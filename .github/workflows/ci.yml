# StockWise CI: runs on every pull request and on every push to main.
# If any step fails, the PR shows a red X and (once branch protection is on)
# it cannot be merged. Render also waits for these checks before deploying.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# If someone pushes twice quickly to the same branch, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with pytest
        run: pytest -v

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      # The frontend folder may not exist yet. Instead of failing, skip the
      # remaining steps and leave a note in the run summary.
      - name: Check whether the frontend exists
        id: check
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package-lock.json not found, so frontend checks were skipped"
          fi

      - name: Install Node.js 22
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint with eslint
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Type-check and build
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
