[tool.pytest.ini_options]
# Lets tests do `from app import ...` when pytest runs from backend/
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# migrations/ is auto-generated by Flask-Migrate/Alembic
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Pin the rule set so new ruff releases don't change what CI checks
select = ["E4", "E7", "E9", "F"]
